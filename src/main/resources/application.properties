spring.application.name=webcrawler

# Redis connection - REDIS_HOST/REDIS_PORT are set to "redis"/6379 by
# docker-compose.yml; they default to localhost:6379 for local development.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3000ms

server.port=${SERVER_PORT:8080}

# Crawler tuning (see CrawlerProperties.java)
crawler.default-max-pages=${CRAWLER_DEFAULT_MAX_PAGES:10}
crawler.max-allowed-pages=${CRAWLER_MAX_ALLOWED_PAGES:100}
crawler.timeout-ms=${CRAWLER_TIMEOUT_MS:5000}
crawler.user-agent=${CRAWLER_USER_AGENT:SystemDesignLab-WebCrawler/1.0}
# DEVELOPMENT ONLY - keep false unless demoing against the bundled
# sample-pages/ static site served from localhost.
crawler.allow-local-targets=${CRAWLER_ALLOW_LOCAL_TARGETS:false}

logging.level.com.example.webcrawler=INFO
